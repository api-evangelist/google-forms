naftiko: 1.0.0-alpha2
info:
  label: Google Forms API — Responses
  description: 'Google Forms API — Responses. 2 operations. Lead operation: Google Forms List Form Responses. Self-contained
    Naftiko capability covering one Google Forms business surface.'
  tags:
  - Google Forms
  - Responses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_FORMS_API_KEY: GOOGLE_FORMS_API_KEY
capability:
  consumes:
  - type: http
    namespace: google-forms-responses
    baseUri: https://forms.googleapis.com
    description: Google Forms API — Responses business capability. Self-contained, no shared references.
    resources:
    - name: v1-forms-formId-responses
      path: /v1/forms/{formId}/responses
      operations:
      - name: listformresponses
        method: GET
        description: Google Forms List Form Responses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: formId
          in: path
          type: string
          description: The ID of the form whose responses to list.
          required: true
        - name: filter
          in: query
          type: string
          description: Filter for responses using timestamp comparison.
        - name: pageSize
          in: query
          type: integer
          description: The maximum number of responses to return.
        - name: pageToken
          in: query
          type: string
          description: Page token returned from a previous list call.
    - name: v1-forms-formId-responses-responseId
      path: /v1/forms/{formId}/responses/{responseId}
      operations:
      - name: getformresponse
        method: GET
        description: Google Forms Get Form Response
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: formId
          in: path
          type: string
          description: The ID of the form.
          required: true
        - name: responseId
          in: path
          type: string
          description: The ID of the response to retrieve.
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_FORMS_API_KEY}}'
  exposes:
  - type: rest
    namespace: google-forms-responses-rest
    port: 8080
    description: REST adapter for Google Forms API — Responses. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/forms/{formid}/responses
      name: v1-forms-formid-responses
      description: REST surface for v1-forms-formId-responses.
      operations:
      - method: GET
        name: listformresponses
        description: Google Forms List Form Responses
        call: google-forms-responses.listformresponses
        with:
          formId: rest.formId
          filter: rest.filter
          pageSize: rest.pageSize
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/forms/{formid}/responses/{responseid}
      name: v1-forms-formid-responses-responseid
      description: REST surface for v1-forms-formId-responses-responseId.
      operations:
      - method: GET
        name: getformresponse
        description: Google Forms Get Form Response
        call: google-forms-responses.getformresponse
        with:
          formId: rest.formId
          responseId: rest.responseId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: google-forms-responses-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Forms API — Responses. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: google-forms-list-form-responses
      description: Google Forms List Form Responses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-forms-responses.listformresponses
      with:
        formId: tools.formId
        filter: tools.filter
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: google-forms-get-form-response
      description: Google Forms Get Form Response
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-forms-responses.getformresponse
      with:
        formId: tools.formId
        responseId: tools.responseId
      outputParameters:
      - type: object
        mapping: $.
